<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="hexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152B48"/>
      <stop offset="100%" stop-color="#2C6BAD"/>
    </linearGradient>
  </defs>
  <!-- Hexagon background -->
  <polygon points="50,5 88,27 88,73 50,95 12,73 12,27" fill="url(#hexBg)"/>
  <!-- Inner outline ring -->
  <polygon points="50,12 83,31 83,69 50,88 17,69 17,31" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <!-- Monogram -->
  <text x="50" y="57"
        font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
        font-weight="900" font-size="26"
        fill="white" text-anchor="middle" letter-spacing="-1">TTP</text>
  <!-- Thin divider -->
  <rect x="30" y="62" width="40" height="1" rx="0.5" fill="rgba(255,255,255,0.2)"/>
  <!-- Sub-label -->
  <text x="50" y="74"
        font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
        font-weight="500" font-size="8"
        fill="rgba(255,255,255,0.65)" text-anchor="middle" letter-spacing="1.5">QA ENGINEER</text>
</svg>
