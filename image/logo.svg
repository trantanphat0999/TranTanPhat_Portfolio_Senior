<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" width="300" height="72">
  <defs>
    <linearGradient id="hexBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152B48"/>
      <stop offset="100%" stop-color="#2C6BAD"/>
    </linearGradient>
  </defs>

  <!-- Icon mark (scaled 64%, centered in 72px height) -->
  <g transform="translate(4,4) scale(0.64)">
    <polygon points="50,5 88,27 88,73 50,95 12,73 12,27" fill="url(#hexBg2)"/>
    <polygon points="50,12 83,31 83,69 50,88 17,69 17,31" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2.5"/>
    <text x="50" y="57"
          font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
          font-weight="900" font-size="26"
          fill="white" text-anchor="middle" letter-spacing="-1">TTP</text>
    <rect x="30" y="62" width="40" height="1.5" rx="0.75" fill="rgba(255,255,255,0.2)"/>
    <text x="50" y="74"
          font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
          font-weight="500" font-size="8"
          fill="rgba(255,255,255,0.65)" text-anchor="middle" letter-spacing="1.5">QA ENGINEER</text>
  </g>

  <!-- Vertical separator -->
  <line x1="70" y1="16" x2="70" y2="56" stroke="#2D5B8E" stroke-width="1" opacity="0.3"/>

  <!-- Full name -->
  <text x="82" y="33"
        font-family="Montserrat,'Helvetica Neue',Arial,sans-serif"
